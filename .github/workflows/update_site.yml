name: Auto Update Deals Site

on:
  schedule:
    # दिन में हर 1 घंटे पर ऑटोमैटिक वेबसाइट अपडेट होगी
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Builder Script
        run: |
          python build.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update live deals" && git push)
