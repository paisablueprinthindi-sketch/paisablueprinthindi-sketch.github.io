name: Auto Update Deals Site

on:
  schedule:
    # 1. रात 02:30 AM से सुबह 10:30 AM IST (धीमा समय) -> हर 1 घंटे में
    - cron: '0 21-23,0-5 * * *'

    # 2. सुबह 11:30 AM से शाम 04:15 PM IST (दोपहर का समय) -> हर 15 मिनट में
    - cron: '*/15 6-10 * * *'

    # 3. शाम 04:30 PM से रात 01:30 AM IST (असली रश ऑवर) -> हर 5 मिनट (मैक्सिमम स्पीड)
    - cron: '*/5 11-20 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Builder Script
        run: |
          python build.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html deals.json sitemap.xml robots.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update live deals" && git push)
